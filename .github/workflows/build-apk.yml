name: Build HKR Tournaments APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          unzip -q HKR_Tournaments_V3_Online.zip
          cd HKR_Tournaments_V3_Online/HKR_Tournaments_V3
          npm install

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK
        working-directory: HKR_Tournaments_V3_Online/HKR_Tournaments_V3
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HKR-Tournaments-APK
          path: HKR_Tournaments_V3_Online/HKR_Tournaments_V3/android/app/build/outputs/apk/debug/app-debug.apk
